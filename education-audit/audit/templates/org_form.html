{% extends 'base.html' %}{% block content %}<h1>Добавление учреждения</h1><form method="post" class="editor"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Название<input required name="name" minlength="3" maxlength="600" value="{{ request.form.get('name','') }}"></label><label>Тип<select name="kind">{% for key,label in kinds.items() %}<option value="{{ key }}" {% if request.form.get('kind')==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Адрес сайта<input required name="url" maxlength="512" placeholder="https://example.ru/" value="{{ request.form.get('url','') }}"></label><p class="muted">Обходятся только публичные сайты по HTTP/HTTPS. Тип определяет применимый чек-лист.</p><button class="button primary">Добавить</button></form>{% endblock %}
